<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Technocore Core Relay symbol</title>
  <desc id="desc">Two opposing communication rails converge on a three-layer persistent memory core.</desc>
  <g fill="#00B4D8">
    <!-- Left agent channel -->
    <rect x="16" y="40" width="32" height="160"/>
    <rect x="48" y="40" width="40" height="32"/>
    <rect x="48" y="168" width="40" height="32"/>
    <rect x="48" y="104" width="40" height="32"/>
    <!-- Right agent channel -->
    <rect x="192" y="40" width="32" height="160"/>
    <rect x="152" y="40" width="40" height="32"/>
    <rect x="152" y="168" width="40" height="32"/>
    <rect x="152" y="104" width="40" height="32"/>
    <!-- Commerce rail and central settlement core -->
    <rect x="88" y="104" width="24" height="32"/>
    <rect x="128" y="104" width="24" height="32"/>
    <rect x="112" y="96" width="16" height="48"/>
    <!-- Persistent memory stack -->
    <rect x="104" y="48" width="32" height="24"/>
    <rect x="96" y="160" width="48" height="16"/>
    <rect x="88" y="184" width="64" height="16"/>
  </g>
</svg>
